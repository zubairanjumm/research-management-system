<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notes — ResearchHub</title>


    <link
        rel="stylesheet"
        href="../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/topbar.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/button.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/card.css"
    >


    <style>

        .notes-page {
            padding: 32px;
        }


        .notes-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 28px;
        }


        .notes-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }


        .notes-search,
        .notes-filter {
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
        }


        .notes-search {
            flex: 1;
        }


        .notes-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }


        .note-card {
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: white;
        }


        .note-card-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }


        .note-card h2 {
            margin: 0;
        }


        .note-card p {
            color: #6b7280;
            line-height: 1.6;
        }


        .note-project {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 9px;
            border-radius: 6px;
            background: #f3f4f6;
            font-size: 13px;
        }


        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 13px;
        }


        .note-menu {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
        }


        .empty-state {
            grid-column: 1 / -1;
            padding: 50px;
            text-align: center;
        }


        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }


        .modal-overlay.active {
            display: flex;
        }


        .modal {
            width: min(500px, 90%);
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.2);
        }


        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }


        .modal-close {
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }


        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
        }


        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }


        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }


        .secondary-button {
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

    </style>

</head>


<body>


<div class="app">


    <aside class="sidebar">

        <div class="logo">
            ResearchHub
        </div>


        <nav class="navigation">

            <a
                href="../index.html"
                class="nav-item"
            >
                Dashboard
            </a>


            <a
                href="projects.html"
                class="nav-item"
            >
                Projects
            </a>


            <a
                href="resources.html"
                class="nav-item"
            >
                Resources
            </a>


            <a
                href="notes.html"
                class="nav-item active"
            >
                Notes
            </a>


            <a
                href="bookmarks.html"
                class="nav-item"
            >
                Bookmarks
            </a>

        </nav>

    </aside>


    <main class="main-content">


        <header class="topbar">

            <div class="search">

                <input
                    type="text"
                    placeholder="Search your research..."
                >

            </div>


            <div class="profile">

                <div class="avatar">
                    A
                </div>

            </div>

        </header>


        <section class="notes-page">


            <div class="notes-header">

                <div>

                    <p class="eyebrow">
                        Knowledge
                    </p>

                    <h1>
                        Notes
                    </h1>

                    <p class="subtitle">
                        Capture and organize what you learn.
                    </p>

                </div>


                <button
                    id="new-note-btn"
                    class="primary-button"
                    type="button"
                >
                    + New Note
                </button>

            </div>


            <div class="notes-toolbar">

                <input
                    id="notes-search"
                    class="notes-search"
                    type="text"
                    placeholder="Search notes..."
                >


                <select
                    id="notes-project-filter"
                    class="notes-filter"
                >

                    <option value="all">
                        All Projects
                    </option>

                </select>

            </div>


            <div
                id="notes-grid"
                class="notes-grid"
            ></div>


        </section>

    </main>

</div>



<!-- New Note Modal -->

<div
    id="note-modal"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                Create New Note
            </h2>


            <button
                id="close-note-modal"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="note-form">


            <div class="form-group">

                <label for="note-title">
                    Title
                </label>

                <input
                    id="note-title"
                    type="text"
                    placeholder="e.g. RAG Architecture"
                    required
                >

            </div>


            <div class="form-group">

                <label for="note-content">
                    Note
                </label>

                <textarea
                    id="note-content"
                    placeholder="Write your note..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="note-project">
                    Project
                </label>

                <select
                    id="note-project"
                    required
                >

                    <option value="">
                        Select project
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    id="cancel-note"
                    type="button"
                    class="secondary-button"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Note
                </button>

            </div>

        </form>

    </div>

</div>



<script src="../js/data.js"></script>

<script src="../js/notes.js"></script>


</body>

</html>
